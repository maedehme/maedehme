version: 2

models:
  - name: silver_airbnb_listings
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

  - name: dim_listing
    columns:
      - name: listing_key
        tests:
          - unique
          - not_null

  - name: dim_host
    columns:
      - name: host_key
        tests:
          - unique
          - not_null

  - name: dim_lga
    columns:
      - name: lga_key
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fact_listing_month
    columns:
      - name: listing_month_key
        tests:
          - unique
          - not_null

      - name: listing_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listing')
                field: listing_key

      - name: host_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: host_key

      - name: lga_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lga')
                field: lga_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: reporting_month_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key