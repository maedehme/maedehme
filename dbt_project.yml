# Project identity.
name: 'bde_at3'
version: '1.0.0'
config-version: 2

profile: 'default'

# Locations of project files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  bde_at3:
    # Disable the starter example models.
    example:
      +enabled: false

    # Clean and standardise the raw Bronze data.
    silver:
      +schema: silver
      +materialized: view

    # Build dimensions, facts and analytical marts.
    gold:
      +schema: gold
      +materialized: table